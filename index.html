<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Party Games"><link rel="manifest" href="manifest.webmanifest"><title>Party Games</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}header{padding:30px 18px 18px;background:linear-gradient(135deg,#32133f,#111);text-align:center}h1{margin:0}.wrap{max-width:600px;margin:auto;padding:16px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game,.card{background:#171717;border:1px solid #ffffff20;border-radius:20px;padding:18px;margin-bottom:12px}.game{text-align:center;font-size:18px;font-weight:900}.game span{display:block;font-size:55px}.screen{display:none}.screen.on{display:block}.home{display:none}.home.on{display:block}.btn{width:100%;padding:16px;border:0;border-radius:15px;font-size:20px;font-weight:900;background:linear-gradient(135deg,#ffe15b,#ff8a00);color:#211200}.back{padding:10px 14px;border:0;border-radius:10px;background:#ffffff18;color:#fff;margin-bottom:10px}.dice{display:flex;justify-content:center;gap:10px;margin:22px 0}.die{width:29%;max-width:100px;aspect-ratio:1;background:#fff;color:#111;border-radius:18px;display:grid;place-items:center;font-size:65px}.role,.result{text-align:center;min-height:70px;font-size:28px;font-weight:900;color:#ffd54d}.row{display:flex;gap:8px}.row>*{flex:1}input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;background:#080808;color:#fff;border:1px solid #555;border-radius:10px;font-size:16px}label{font-size:13px}#wheelbox{position:relative;width:min(84vw,420px);max-width:100%;aspect-ratio:1;margin:15px auto}#wheel{width:100%;height:100%;border-radius:50%;border:5px solid #fff;transition:transform 4s cubic-bezier(.1,.7,.05,1)}#pointer{position:absolute;z-index:2;top:-5px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:35px solid #ffd84a}.note{font-size:11px;color:#888;text-align:center;margin-top:20px}
</style></head><body><header><h1>🎉 PARTY GAMES</h1><div>みんなで遊べるミニゲーム</div></header><main class="wrap">
<section id="home" class="home on"><div class="menu"><div class="game" onclick="openGame('chinchiro')"><span>🎲</span>チンチロ</div><div class="game" onclick="openGame('roulette')"><span>🎰</span>飲み会ルーレット</div></div><div class="card"><b>📱 PWA対応</b><p>Safariの共有 →「ホーム画面に追加」でアプリとして起動できます。</p></div></section>
<section id="chinchiro" class="screen"><button class="back" onclick="home()">← ゲーム一覧</button><h2>🎲 チンチロ</h2><div class="card">総投数：<b id="total">0</b>　役なし：<b id="none">0</b>　ゾロ目：<b id="zoro">0</b></div><div class="dice"><div class="die" id="d1">⚀</div><div class="die" id="d2">⚀</div><div class="die" id="d3">⚀</div></div><div class="role" id="role">サイコロを振れ！</div><button class="btn" onclick="rollDice()">🎲 サイコロを振る！</button></section>
<section id="roulette" class="screen"><button class="back" onclick="home()">← ゲーム一覧</button><h2>🎰 飲み会ルーレット</h2><div id="setup" class="card"><div class="row"><div><label>参加人数</label><input id="people" type="number" value="6" min="2" max="30"></div><div><label>選ばれる人数</label><input id="pick" type="number" value="1" min="1" max="30"></div></div><label>コール</label><select id="call"><option>ぐい！ぐいっぐい！あー、よいしょ！</option><option>いっきっきーのきーーー！</option><option>テキーラ！！！！</option></select><label>参加者名（1行1人・任意）</label><textarea id="names"></textarea><button class="btn" onclick="startRoulette()">ゲーム開始</button></div><div id="rgame" style="display:none"><div id="wheelbox"><div id="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div><div class="result" id="result">SPINを押せ！</div><button class="btn" onclick="spin()">🎰 SPIN!</button></div></section>
<div class="note">パーティーゲームとして無理のない範囲で遊んでください。</div></main><script>
const $=x=>document.getElementById(x),faces=["⚀","⚁","⚂","⚃","⚄","⚅"];let players=[],rot=0,cs=JSON.parse(localStorage.getItem("chinchiro")||'{"total":0,"none":0,"zoro":0}');
function openGame(id){$("home").classList.remove("on");$(id).classList.add("on")}function home(){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$("home").classList.add("on")}function cv(){$("total").textContent=cs.total;$("none").textContent=cs.none;$("zoro").textContent=cs.zoro}cv();
function judge(a){let s=a.slice().sort((a,b)=>a-b);if(s[0]==1&&s[2]==1){cs.zoro++;return"ピンゾロ！！！"}if(s[0]==s[2]){cs.zoro++;return s[0]+"のゾロ目！"}if(s.join("")=="456")return"シゴロ！！！";if(s.join("")=="123")return"ヒフミ…";let c={};s.forEach(v=>c[v]=(c[v]||0)+1);for(let k in c)if(c[k]==2)return s.find(v=>v!=+k)+"の目";cs.none++;return"役なし"}
function rollDice(){let n=0,i=setInterval(()=>{[1,2,3].forEach(x=>$("d"+x).textContent=faces[Math.floor(Math.random()*6)]);if(++n>10){clearInterval(i);let a=[1,2,3].map(()=>1+Math.floor(Math.random()*6));a.forEach((v,j)=>$("d"+(j+1)).textContent=faces[v-1]);cs.total++;$("role").textContent=judge(a);localStorage.setItem("chinchiro",JSON.stringify(cs));cv()}},70)}
function draw(){let c=$("wheel"),x=c.getContext("2d"),N=players.length;x.clearRect(0,0,700,700);for(let i=0;i<N;i++){let a=-Math.PI/2+i*2*Math.PI/N,b=-Math.PI/2+(i+1)*2*Math.PI/N;x.beginPath();x.moveTo(350,350);x.arc(350,350,340,a,b);x.closePath();x.fillStyle=`hsl(${(330+i*360/N)%360},78%,${i%2?45:57}%)`;x.fill();x.strokeStyle="#ffffff55";x.stroke();x.save();x.translate(350,350);x.rotate((a+b)/2);x.fillStyle="#fff";x.font="bold 28px Arial";x.textAlign="right";x.fillText(players[i].slice(0,8),315,0);x.restore()}}
function startRoulette(){let n=Math.max(2,Math.min(30,+$("people").value||6)),ns=$("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean);players=Array.from({length:n},(_,i)=>ns[i]||`${i+1}番`);$("setup").style.display="none";$("rgame").style.display="block";draw()}
function spin(){let pc=Math.max(1,Math.min(players.length,+$("pick").value||1)),w=players.slice().sort(()=>Math.random()-.5).slice(0,pc),idx=players.indexOf(w[0]),seg=360/players.length,des=360-(idx+.5)*seg,cur=((rot%360)+360)%360;rot+=2160+(des-cur+360)%360;$("wheel").style.transform=`rotate(${rot}deg)`;$("result").textContent="誰だ…！？";setTimeout(()=>{$("result").textContent=w.join(" ＆ ")+"　"+$("call").value},4100)}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
